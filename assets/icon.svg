<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052ff"/>
      <stop offset="100%" stop-color="#00d395"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d395" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0052ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Base Network Circle Accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0052ff" stroke-width="6" stroke-dasharray="8 12" stroke-opacity="0.35"/>

  <!-- SelfPaid Core Symbol: Infinity Yield Loop + Shield -->
  <!-- Outer Yield Loop -->
  <path d="M190 196 C140 196 110 230 110 266 C110 306 148 336 196 336 C240 336 270 296 316 296 C362 296 398 322 398 266 C398 214 360 196 316 196 C272 196 240 236 196 236 C160 236 142 220 142 206 C142 186 166 176 192 176 C236 176 274 204 316 246" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Upward Growth Arrow (Yield Recovery) -->
  <polyline points="350,150 402,150 402,202" fill="none" stroke="#00d395" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="286" y1="266" x2="398" y2="154" stroke="#00d395" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Energy Core -->
  <circle cx="256" cy="256" r="14" fill="#00d395" filter="url(#glow)"/>
</svg>
